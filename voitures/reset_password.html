<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le mot de passe</title>
  <link rel="stylesheet" href="styless.css">
  <script>
    // Fonction pour valider le formulaire avant l'envoi
    window.onload = function () {
    document.getElementById("email").value = "";
    document.getElementById("old_password").value = "";
    document.getElementById("new_password").value = "";
    document.getElementById("confirm_password").value = "";
  };
    function validateForm(event) {
      event.preventDefault();  // Empêche la soumission automatique du formulaire

      const newPassword = document.getElementById("new_password").value;
      const confirmPassword = document.getElementById("confirm_password").value;

      // Vérifier si les mots de passe correspondent
      if (newPassword !== confirmPassword) {
        alert("Les mots de passe ne correspondent pas. Veuillez vérifier.");
        return;
      }

      // Vérification de la complexité du mot de passe
      if (newPassword.length < 8) {
        alert("Le mot de passe doit contenir au moins 8 caractères.");
        return;
      }

      // Si tout est correct, soumettre le formulaire
      document.getElementById("resetForm").submit();
    }
    window.onload = function () {
  const params = new URLSearchParams(window.location.search);
  const popupType = params.get('popup');

  if (popupType === "reset") {
    const popup = document.createElement("div");
    popup.id = "popup";
    popup.style.position = "fixed";
    popup.style.top = "0";
    popup.style.left = "0";
    popup.style.width = "100%";
    popup.style.height = "100%";
    popup.style.background = "rgba(0, 0, 0, 0.5)";
    popup.style.display = "flex";
    popup.style.alignItems = "center";
    popup.style.justifyContent = "center";
    popup.style.zIndex = "1000";

    const messageBox = document.createElement("div");
    messageBox.style.background = "#fff";
    messageBox.style.padding = "20px";
    messageBox.style.borderRadius = "8px";
    messageBox.style.boxShadow = "0 0 10px rgba(0,0,0,0.3)";
    messageBox.textContent = "Mot de passe réinitialisé avec succès !";

    popup.appendChild(messageBox);
    document.body.appendChild(popup);

    // Supprimer le popup après 3 secondes
    setTimeout(() => {
      document.body.removeChild(popup);
    }, 3000);
  }
};
  </script>
</head>
<body>

  <div class="reset-password-container">
    <h1 >Réinitialiser votre mot de passe</h1>
    <form id="resetForm" action="reset_password.php" method="POST" onsubmit="validateForm(event)" autocomplete="off">
      <div class="input-group">
        <label for="email">Adresse Email</label>
        <!-- Chrome piège : champ factice -->
<input type="text" name="fake_field" id="fake_field" style="display:none;" autocomplete="off">
        <input type="email" id="email" name="email" placeholder="Entrez votre email" required autocomplete="nope">
      </div>
      <div class="input-group">
        <label for="old_password">Ancien Mot de Passe</label>
        <!-- Chrome piège : champ factice -->
<input type="text" name="fake_field" id="fake_field" style="display:none;" autocomplete="off">

        <input type="password" id="old_password" name="old_password" placeholder="Entrez votre ancien mot de passe" required autocomplete="new-password">
      </div>
      <div class="input-group">
        <label for="new_password">Nouveau Mot de Passe</label>
        <input type="password" id="new_password" name="new_password" placeholder="Entrez votre nouveau mot de passe" required autocomplete="off">
      </div>
      <div class="input-group">
        <label for="confirm_password">Confirmer le Mot de Passe</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirmez votre mot de passe" required autocomplete="off">
      </div>
      <button type="submit">Mettre à jour le mot de passe</button>
    </form>
  </div>

</body>
</html>
