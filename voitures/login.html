<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion</title>
  <link rel="stylesheet" href="styless.css">
  <script>
    async function validateForm(event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      const formData = new FormData();
      formData.append("email", username);
      formData.append("password", password);

      try {
        const response = await fetch("login.php", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          if (data.poste === "Administrateur") {
            window.location.href = "admin.php";
          } else if (data.poste === "Client") {
            window.location.href = "client.php";
          }
        } else {
          alert(data.message);
        }
      } catch (error) {
        console.error("Erreur :", error);
        alert("Erreur lors de la tentative de connexion.");
      }
    }
  </script>
</head>
<body>
  <div class="login-container">
    <h1>Connexion</h1>
    <form onsubmit="validateForm(event)" autocomplete="off">
      <div class="input-group">
        <label for="username">Adresse Email</label>
        <input type="email" id="username" name="username" placeholder="Entrez votre email" required autocomplete="off">
      </div>
      <div class="input-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required autocomplete="new-password">
      </div>
      <button type="submit">Se connecter</button>
    </form>
    <p>
      <a href="reset_password.html">Mot de passe oublié ?</a>
      <a href="signup.php">S'inscrire</a>
    </p>
  </div>
</body>
</html>
